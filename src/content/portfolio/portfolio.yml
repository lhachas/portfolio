      problem: "Portafolios inflados con librerías reactivas innecesarias, CSS desordenado con opacidades confusas (glassmorphism) y contenido hardcodeado difícil de mantener."
      solution: "Arquitectura de componentes nativos Astro con CSS puro de alto contraste, cero glassmorphism, tipografía con jerarquía editorial y centralización en Content Collections YAML."
