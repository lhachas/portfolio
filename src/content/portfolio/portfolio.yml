  items:
    - id: "taxi24"
      title: "Taxi24 - Core Dispatch & Mobility Engine"
      tagline: "Motor backend de alta disponibilidad para asignación de viajes, geocercas y gestión de flotas en tiempo real."
      category: "backend-api"
      categoryLabel: "Backend & APIs"
      badge: "Clean Architecture · DDD"
      accentColor: "#3f87f5"
      icon: "icofont-car-alt-4"
      repoUrl: "https://github.com/LHachaS/taxi24"
      architecture: "Clean Architecture y Domain-Driven Design (DDD) con separación estricta de dominio, casos de uso, repositorios desacoplados y máquina de estados finitos transaccional."
      problem: "Latencia elevada y colisiones por condiciones de carrera al emparejar cientos de conductores con pasajeros concurrentes bajo criterios estrictos de proximidad geográfica."
      solution: "Pipeline desacoplado en NestJS con consultas geoespaciales indexadas en PostgreSQL/PostGIS, locking pesimista controlado para viajes y eventos de dominio para actualización de flota."
      impact: "Tiempos de respuesta p95 sub-50ms en consultas de proximidad, 100% consistencia transaccional sin sobreasignaciones y cobertura de pruebas unitarias/e2e con Docker."
      stack:
        - "NestJS"
        - "TypeScript"
        - "PostgreSQL"
        - "TypeORM"
        - "Docker"
        - "PostGIS"
        - "Clean Architecture"
        - "Jest"
      highlights:
        - "Despacho geoespacial determinista con indexación espacial GiST en PostgreSQL"
        - "Máquina de estados finitos que previene cancelaciones y dobles asignaciones concurrentes"
        - "Arquitectura modular testeada con suites completas de pruebas unitarias y de integración"
      stats:
        - label: "Latencia p95"
          value: "< 50ms"
        - label: "Consistencia"
          value: "100% ACID"
        - label: "Tests Core"
          value: "92% Cobertura"

    - id: "control-see"
      title: "Control-SEE - Facturación Electrónica UBL 2.1"
      tagline: "Motor fiscal de emisión, firma digital XMLDSig y sincronización SOAP con SUNAT/OSE de misión crítica."
      category: "cloud-microservices"
      categoryLabel: "Microservicios & Cloud"
      badge: "XMLDSig · UBL 2.1 · SOAP"
      accentColor: "#10b981"
      icon: "icofont-bill"
      repoUrl: "https://github.com/LHachaS/control-see"
      architecture: "Microservicio desacoplado con generador canónico de XML UBL 2.1, wrapper criptográfico de firma digital X.509 SHA-256 y cliente SOAP resiliente con reintentos exponenciales."
      problem: "Complejidad tributaria extrema, rechazos por malformación de XML UBL 2.1 y caídas frecuentes durante la comunicación síncrona con servidores de SUNAT."
      solution: "Validación estricta de esquemas XSD tributarios en memoria, firma digital criptográfica XMLDSig y cola de reintentos asíncrona ante fallos de conexión fiscal."
      impact: "Cero discrepancias tributarias, validación instantánea de comprobantes electrónicos y desacoplamiento total del core ERP respecto a los servidores de SUNAT."
      stack:
        - "Node.js"
        - "TypeScript"
        - "NestJS"
        - "XML UBL 2.1"
        - "XMLDSig"
        - "SOAP Web Services"
        - "PostgreSQL"
        - "Docker"
      highlights:
        - "Generación canónica de comprobantes (Facturas, Boletas, Notas de Crédito/Débito) bajo estándar UBL 2.1"
        - "Firma digital en conformidad con la norma técnica peruana y certificados de clave pública X.509"
        - "Manejo resiliente de caídas del servidor fiscal con colas de contingencia y validación de CDR"
      stats:
        - label: "Estándar Fiscal"
          value: "UBL 2.1"
        - label: "Firma Digital"
          value: "SHA-256"
        - label: "Resiliencia"
          value: "Retry Loop"

    - id: "padron-sunat"
      title: "Padrón SUNAT - High-Throughput Fiscal Search"
      tagline: "Pipeline de ingesta masiva (ETL) y motor de búsqueda de alta concurrencia sobre millones de registros RUC."
      category: "enterprise-tools"
      categoryLabel: "Herramientas & ETL"
      badge: "ETL Streams · Nx Monorepo"
      accentColor: "#ea6a15"
      icon: "icofont-database"
      repoUrl: "https://github.com/LHachaS/padron-sunat"
      architecture: "Nx Monorepo modular que combina pipeline ETL con streaming para descompresión/ingesta masiva de archivos ZIP gubernamentales y API de consulta ultrarrápida indexada."
      problem: "Archivos masivos de más de 4 millones de contribuyentes provistos por SUNAT en formatos de texto plano pesados y no indexados, colapsando consultas operativas."
      solution: "Procesamiento por streaming con chunks no bloqueantes, normalización de esquemas en tiempo de ingesta y generación de índices B-Tree de alta velocidad."
      impact: "Búsquedas sub-10ms sobre millones de registros fiscales, reducción del consumo de memoria en 80% durante la carga masiva y arquitectura monorepo compartida."
      stack:
        - "Nx Monorepo"
        - "TypeScript"
        - "Node.js"
        - "Angular"
        - "SQLite / PostgreSQL"
        - "ETL Streams"
        - "Docker"
      highlights:
        - "Pipeline de streaming no bloqueante con bajo consumo de memoria RAM (< 250MB)"
        - "Búsqueda instantánea por RUC, razón social y estado tributario con índices compuestos"
        - "Arquitectura de monorepo escalable con bibliotecas compartidas entre backend y frontend"
      stats:
        - label: "Registros RUC"
          value: "4M+ Activos"
        - label: "Tiempo Consulta"
          value: "< 10ms"
        - label: "Ahorro Memoria"
          value: "80% RAM"

    - id: "portfolio"
      title: "Portfolio - Solid Minimalist Engineering"
      tagline: "Portafolio web ultraveloz, bilingüe y 100% sólido construido con Astro 5, Tailwind CSS v4 y Zod SSOT."
      category: "web-fullstack"
      categoryLabel: "Full-Stack & Web"
      badge: "Astro 5 · Tailwind CSS v4"
      accentColor: "#8b5cf6"
      icon: "icofont-web"
