about:
  sectionIcon: "icofont-man-in-glasses"
  titlePrefix: "Perfil"
  titleHighlight: "Profesional"
  lead: "Más de 9 años de experiencia diseñando y desarrollando soluciones de software escalables y mantenibles para los sectores financiero, retail, logístico y educativo."
  roleTitle: "Senior Backend Developer"
  roleHighlight: "| Full Stack Developer"
  paragraphs:
    - "Construyo servicios backend robustos y escalables con Node.js, TypeScript, NestJS, Java (15/17/21) y Spring Boot/WebFlux, integrando interfaces web modernas en Angular, React y Vue.js. Mi trayectoria abarca el diseño e implementación de arquitecturas Serverless, Event-Driven (EDA) y Hexagonal en AWS, integración de APIs REST, GraphQL y SOAP, gestión de bases de datos SQL/NoSQL y despliegue en contenedores mediante Docker y Kubernetes."
    - "Me enfoco en escribir código limpio y mantenible aplicando principios de Clean Code, Domain-Driven Design (DDD), patrones de diseño, pruebas automatizadas, observabilidad y flujos de integración continua (CI/CD). Además, integro herramientas de desarrollo asistido por IA en mi flujo de trabajo para agilizar la refactorización de código legacy, la revisión de seguridad (OWASP) y la documentación técnica (OpenAPI, C4)."
