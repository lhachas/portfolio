    - id: "taxi24"
      title: "Taxi24 - Core Dispatch & Mobility Engine"
      tagline: "High-availability backend engine for real-time ride dispatching, geofencing, and driver-passenger matching."
      category: "backend-api"
      categoryLabel: "Backend & APIs"
      badge: "Clean Architecture · DDD"
      accentColor: "#3f87f5"
      icon: "icofont-car-alt-4"
      repoUrl: "https://github.com/LHachaS/taxi24"
      architecture: "Clean Architecture and Domain-Driven Design (DDD) with strict layer separation, decoupled repositories, and transactional finite state machine for trip lifecycles."
      problem: "High latency, race conditions, and contention when matching hundreds of concurrent passengers and drivers under strict geographic proximity criteria."
      solution: "Decoupled NestJS pipeline with GiST spatial indexing in PostgreSQL/PostGIS, controlled pessimistic locking for bookings, and domain events for fleet updates."
      impact: "Sub-50ms p95 response times in dispatch queries, 100% ACID consistency preventing double assignments, and complete unit/e2e test suites in Docker."
      stack:
        - "NestJS"
